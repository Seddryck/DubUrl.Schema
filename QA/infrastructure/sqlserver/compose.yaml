services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU22-ubuntu-22.04
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configure an ephemeral QA password}
    ports:
      - "127.0.0.1:${DUBURL_SQLSERVER_QA_PORT:-1433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 60

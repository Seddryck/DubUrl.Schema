services:
  postgresql:
    image: ${POSTGRES_IMAGE:-postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure an ephemeral QA password}
      POSTGRES_DB: DubUrl
    ports:
      - "127.0.0.1:${DUBURL_POSTGRESQL_QA_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d DubUrl" ]
      interval: 2s
      timeout: 5s
      retries: 20

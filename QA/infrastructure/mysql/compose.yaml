services:
  mysql:
    image: mysql:8@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure an ephemeral QA password}
      MYSQL_DATABASE: DubUrl
    ports:
      - "127.0.0.1:${DUBURL_MYSQL_QA_PORT:-3306}:3306"
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 3s
      timeout: 5s
      retries: 30
